
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f6fb;color:#222}
header{background:#172b50;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button,input,select{padding:10px;border-radius:6px}
button{border:0;background:#315ee7;color:white;cursor:pointer;margin:3px}
button:hover{background:#193da8}
input,select{border:1px solid #ccc}
main{max-width:1100px;margin:auto;padding:24px}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
.card{background:white;padding:18px;border-radius:12px;text-align:center;box-shadow:0 3px 12px #0001;transition:.25s}
.card:hover{transform:translateY(-7px);box-shadow:0 12px 25px #0002}
.picture{font-size:65px;background:#edf1ff;padding:20px;border-radius:8px}
.price{font-size:21px;font-weight:bold;color:#16804a}
.panel{background:white;margin-top:25px;padding:20px;border-radius:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #ddd;padding:12px 0}
.hidden{display:none}
.secondary{background:#e9edff;color:#315ee7}
.danger{background:#b52d38}
footer{text-align:center;padding:25px;background:#172b50;color:white}
#toast{position:fixed;bottom:15px;right:15px;background:#172b50;color:white;padding:15px;border-radius:8px;display:none}
@media(max-width:750px){.products{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.products{grid-template-columns:1fr}main{padding:14px}}
</style>
</head>
<body>
<header>
<h2>Product Store</h2>
<input id="search" placeholder="Search products">
<button id="cartOpen">🛒 Cart (<span id="count">0</span>)</button>
<button id="wishOpen">♡ Wishlist (<span id="wishCount">0</span>)</button>
</header>
<main>
<h1>Our Products</h1>
<div class="filters">
<button data-cat="all">All</button>
<button data-cat="electronics">Electronics</button>
<button data-cat="clothing">Clothing</button>
<button data-cat="accessories">Accessories</button>
<select id="sort">
<option value="default">Recommended</option>
<option value="low">Price low to high</option>
<option value="high">Price high to low</option>
<option value="name">Name A-Z</option>
</select>
</div>
<div id="products" class="products"></div>
<section id="cartPanel" class="panel hidden">
<h2>Shopping Cart</h2><div id="cartItems"></div>
<h3>Total: ₹<span id="total">0</span></h3>
<button id="checkout">Checkout</button>
<button id="clear">Clear Cart</button>
<button id="cartClose" class="secondary">Close</button>
</section>
<section id="wishPanel" class="panel hidden">
<h2>My Wishlist</h2><div id="wishItems" class="products"></div>
<button id="wishClose" class="secondary">Close Wishlist</button>
</section>
</main>
<footer><p>© 2026 Product Store</p><button id="top">Back to Top</button></footer>
<div id="toast" role="status"></div>
<script>
const products=[
{id:1,name:"Smartphone",cat:"electronics",price:15000,icon:"📱",desc:"Modern smartphone for everyday use."},
{id:2,name:"Laptop",cat:"electronics",price:45000,icon:"💻",desc:"Laptop for study and work."},
{id:3,name:"Headphones",cat:"electronics",price:1500,icon:"🎧",desc:"Comfortable headphones for music."},
{id:4,name:"T-Shirt",cat:"clothing",price:500,icon:"👕",desc:"Casual cotton T-shirt."},
{id:5,name:"Shoes",cat:"clothing",price:1800,icon:"👟",desc:"Comfortable everyday shoes."},
{id:6,name:"Watch",cat:"accessories",price:2500,icon:"⌚",desc:"Stylish everyday watch."}
];
let cart=[],wishlist=[],category="all",timer;
const $=id=>document.getElementById(id);
const money=n=>n.toLocaleString("en-IN");
function toast(msg){$("toast").textContent=msg;$("toast").style.display="block";clearTimeout(timer);timer=setTimeout(()=>$("toast").style.display="none",2200)}
function renderProducts(){
let q=$("search").value.toLowerCase();
let list=products.filter(p=>(category==="all"||p.cat===category)&&(p.name.toLowerCase().includes(q)||p.cat.includes(q)));
if($("sort").value==="low")list.sort((a,b)=>a.price-b.price);
if($("sort").value==="high")list.sort((a,b)=>b.price-a.price);
if($("sort").value==="name")list.sort((a,b)=>a.name.localeCompare(b.name));
$("products").innerHTML=list.length?list.map(p=>`
<article class="card"><div class="picture">${p.icon}</div><h3>${p.name}</h3>
<p>${p.cat}</p><p class="price">₹${money(p.price)}</p>
<button data-action="add" data-id="${p.id}">Add to Cart</button>
<button class="secondary" data-action="wish" data-id="${p.id}">${wishlist.includes(p.id)?"♥ Saved":"♡ Wishlist"}</button>
<button class="secondary" data-action="details" data-id="${p.id}">Details</button></article>`).join(""):"<p>No products found.</p>";
}
function renderCart(){
$("count").textContent=cart.reduce((s,i)=>s+i.qty,0);let total=0;
$("cartItems").innerHTML=cart.length?cart.map(i=>{let p=products.find(x=>x.id===i.id);total+=p.price*i.qty;return `<div class="row"><span>${p.icon} ${p.name} — ₹${money(p.price)}</span><div><button data-cart="minus" data-id="${p.id}">−</button>${i.qty}<button data-cart="plus" data-id="${p.id}">+</button><button class="danger" data-cart="remove" data-id="${p.id}">Remove</button></div></div>`}).join(""):"<p>Your cart is empty.</p>";
$("total").textContent=money(total);
}
function renderWishlist(){
$("wishCount").textContent=wishlist.length;
let list=products.filter(p=>wishlist.includes(p.id));
$("wishItems").innerHTML=list.length?list.map(p=>`<article class="card"><div class="picture">${p.icon}</div><h3>${p.name}</h3><p>₹${money(p.price)}</p><button data-action="add" data-id="${p.id}">Add to Cart</button><button class="danger" data-action="wish" data-id="${p.id}">Remove</button></article>`).join(""):"<p>Your wishlist is empty.</p>";
}
function action(event){
let b=event.target.closest("[data-action]");if(!b)return;let id=Number(b.dataset.id);
if(b.dataset.action==="add"){let i=cart.find(x=>x.id===id);i?i.qty++:cart.push({id,qty:1});renderCart();toast("Added to cart!")}
if(b.dataset.action==="wish"){wishlist=wishlist.includes(id)?wishlist.filter(x=>x!==id):[...wishlist,id];renderProducts();renderWishlist();toast("Wishlist updated")}
if(b.dataset.action==="details"){let p=products.find(x=>x.id===id);alert(p.name+"\nPrice: ₹"+money(p.price)+"\n"+p.desc)}
}
$("products").addEventListener("click",action);$("wishItems").addEventListener("click",action);
$("cartItems").addEventListener("click",e=>{let b=e.target.closest("[data-cart]");if(!b)return;let i=cart.find(x=>x.id===+b.dataset.id);if(b.dataset.cart==="plus")i.qty++;if(b.dataset.cart==="minus")i.qty--;if(b.dataset.cart==="remove")i.qty=0;cart=cart.filter(x=>x.qty>0);renderCart()});
document.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>{category=b.dataset.cat;renderProducts()}));
$("search").addEventListener("input",renderProducts);$("sort").addEventListener("change",renderProducts);
$("cartOpen").onclick=()=>{$("cartPanel").classList.remove("hidden");$("wishPanel").classList.add("hidden");renderCart()};
$("wishOpen").onclick=()=>{$("wishPanel").classList.remove("hidden");$("cartPanel").classList.add("hidden");renderWishlist()};
$("cartClose").onclick=()=>$("cartPanel").classList.add("hidden");
$("wishClose").onclick=()=>$("wishPanel").classList.add("hidden");
$("clear").onclick=()=>{cart=[];renderCart();toast("Cart cleared")};
$("checkout").onclick=()=>{if(!cart.length)return toast("Cart is empty");if(confirm("Place demo order for ₹"+$("total").textContent+"?")){cart=[];renderCart();toast("Demo order placed")}};
$("top").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
renderProducts();renderCart();renderWishlist();
</script>
</body>
</html>
