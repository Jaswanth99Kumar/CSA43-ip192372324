
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Hover Effect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="products">
        <h1>Our Products</h1>
        <p class="subtitle">Discover our latest products</p>

        <div class="product-container">

            <div class="product-card">
                <div class="product-image">🎧</div>
                <h2>Headphones</h2>
                <p>High-quality wireless headphones.</p>
                <h3>₹999</h3>
                <button>Buy Now</button>
            </div>

            <div class="product-card">
                <div class="product-image">⌚</div>
                <h2>Smart Watch</h2>
                <p>Track your fitness every day.</p>
                <h3>₹1,499</h3>
                <button>Buy Now</button>
            </div>

            <div class="product-card">
                <div class="product-image">📱</div>
                <h2>Smartphone</h2>
                <p>Enjoy a smooth mobile experience.</p>
                <h3>₹12,999</h3>
                <button>Buy Now</button>
            </div>

        </div>
    </section>

</body>
</html>
