
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEasy Online Store</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#222}
header{background:#172b50;color:white;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-size:26px;font-weight:bold;color:white}
input,select{padding:11px;border:1px solid #ccc;border-radius:6px}
#search{width:260px;max-width:100%}
button{border:0;padding:10px 14px;border-radius:6px;background:#315ee7;color:white;cursor:pointer;margin:3px}
button:hover{background:#193da8}
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;background:white;padding:14px}
nav button{background:#edf0ff;color:#263d7b}
nav button.active{background:#315ee7;color:white}
.hero{background:linear-gradient(120deg,#172b50,#4778f5);color:white;padding:45px 7%;text-align:center}
.hero h1{font-size:36px}
.hero button{background:white;color:#315ee7;font-weight:bold}
main{max-width:1150px;margin:auto;padding:25px}
.heading{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:20px}
.card{background:white;padding:16px;border-radius:10px;text-align:center;box-shadow:0 3px 12px #0001;transition:.2s}
.card:hover{transform:translateY(-5px);box-shadow:0 8px 22px #0002}
.picture{font-size:65px;background:#edf1ff;padding:20px;border-radius:8px}
.card h3{margin-bottom:8px}
.price{font-size:20px;color:#16804a;font-weight:bold}
.actions{display:flex;justify-content:center;flex-wrap:wrap}
.secondary{background:#e9edff;color:#315ee7}
.danger{background:#b52d38;color:white}
.panel{background:white;margin-top:25px;padding:20px;border-radius:10px}
.hidden{display:none!important}
.cart-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #ddd}
.total{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}
footer{text-align:center;background:#172b50;color:white;padding:25px;margin-top:40px}
#toast{display:none;position:fixed;bottom:20px;right:20px;background:#172b50;color:white;padding:15px;border-radius:7px}
.empty{padding:15px;color:#777}
@media(max-width:900px){.products{grid-template-columns:repeat(2,1fr)}}
@media(max-width:550px){.products{grid-template-columns:1fr}header{justify-content:center}#search{width:100%}.hero h1{font-size:28px}main{padding:15px}}
</style>
</head>

<body>
<header>
  <div class="logo">ShopEasy</div>
  <input id="search" placeholder="Search products...">
  <button id="cartButton">🛒 Cart (<span id="count">0</span>)</button>
  <button id="wishButton">♡ Wishlist</button>
</header>

<nav>
  <button class="active" data-category="all">All Products</button>
  <button data-category="electronics">Electronics</button>
  <button data-category="clothing">Clothing</button>
  <button data-category="accessories">Accessories</button>
</nav>

<section class="hero">
  <h1>Welcome to ShopEasy</h1>
  <p>Discover great products at amazing prices.</p>
  <button id="shopButton">Shop Now</button>
</section>

<main>
  <div class="heading">
    <div><h2>Our Products</h2><p>Find your favorite products.</p></div>
    <select id="sort">
      <option value="default">Recommended</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
      <option value="name">Name: A to Z</option>
    </select>
  </div>

  <div id="products" class="products"></div>

  <section id="cartPanel" class="panel hidden">
    <div class="heading"><h2>Shopping Cart</h2>
      <button id="closeCart" class="secondary">Close</button></div>
    <div id="cartItems"></div>
    <div class="total"><strong>Total: ₹<span id="total">0</span></strong>
      <button id="checkout">Checkout</button></div>
    <button id="clearCart" class="danger">Clear Cart</button>
  </section>

  <section id="wishPanel" class="panel hidden">
    <div class="heading"><h2>My Wishlist</h2>
      <button id="closeWish" class="secondary">Close</button></div>
    <div id="wishItems" class="products"></div>
  </section>
</main>

<footer>
  <h2>ShopEasy</h2>
  <p>Online shopping made simple.</p>
  <p>© 2026 ShopEasy</p>
  <button id="topButton">Back to Top ↑</button>
</footer>
<div id="toast" role="status"></div>

<script>
const products=[
 {id:1,name:"Smartphone",category:"electronics",price:15000,icon:"📱",desc:"A modern smartphone for everyday use."},
 {id:2,name:"Laptop",category:"electronics",price:45000,icon:"💻",desc:"A powerful laptop for study and work."},
 {id:3,name:"Headphones",category:"electronics",price:1500,icon:"🎧",desc:"Enjoy music with comfortable headphones."},
 {id:4,name:"T-Shirt",category:"clothing",price:500,icon:"👕",desc:"A comfortable casual T-shirt."},
 {id:5,name:"Shoes",category:"clothing",price:1800,icon:"👟",desc:"Everyday shoes for walking."},
 {id:6,name:"Smart Watch",category:"accessories",price:2500,icon:"⌚",desc:"A stylish watch for your daily routine."},
 {id:7,name:"Sunglasses",category:"accessories",price:800,icon:"🕶️",desc:"Classic sunglasses for sunny days."},
 {id:8,name:"Camera",category:"electronics",price:22000,icon:"📷",desc:"Capture your favorite memories."}
];

let cart=[];
let wishlist=[];
let category="all";
let toastTimer;

const $=id=>document.getElementById(id);
const money=n=>n.toLocaleString("en-IN");

function notify(message){
  $("toast").textContent=message;
  $("toast").style.display="block";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$("toast").style.display="none",2500);
}

function renderProducts(){
  const search=$("search").value.trim().toLowerCase();
  let list=products.filter(p=>
    (category==="all"||p.category===category)&&
    (p.name.toLowerCase().includes(search)||p.category.includes(search))
  );
  const sort=$("sort").value;
  if(sort==="low")list.sort((a,b)=>a.price-b.price);
  if(sort==="high")list.sort((a,b)=>b.price-a.price);
  if(sort==="name")list.sort((a,b)=>a.name.localeCompare(b.name));

  $("products").innerHTML=list.length?list.map(p=>`
    <article class="card">
      <div class="picture">${p.icon}</div>
      <h3>${p.name}</h3>
      <p>${p.category}</p>
      <p class="price">₹${money(p.price)}</p>
      <div class="actions">
        <button data-action="add" data-id="${p.id}">Add to Cart</button>
        <button class="secondary" data-action="wish" data-id="${p.id}">
          ${wishlist.includes(p.id)?"♥ Saved":"♡ Wishlist"}</button>
        <button class="secondary" data-action="details" data-id="${p.id}">Details</button>
      </div>
    </article>`).join(""):'<p class="empty">No products found.</p>';
}

function renderCart(){
  $("count").textContent=cart.reduce((s,p)=>s+p.qty,0);
  let total=0;
  $("cartItems").innerHTML=cart.length?cart.map(item=>{
    const p=products.find(x=>x.id===item.id);
    total+=p.price*item.qty;
    return `<div class="cart-row">
      <span>${p.icon} ${p.name}<br>₹${money(p.price)} each</span>
      <div>
        <button class="secondary" data-action="minus" data-id="${p.id}">−</button>
        ${item.qty}
        <button class="secondary" data-action="plus" data-id="${p.id}">+</button>
        <button class="danger" data-action="remove" data-id="${p.id}">Remove</button>
      </div></div>`;
  }).join(""):'<p class="empty">Your cart is empty.</p>';
  $("total").textContent=money(total);
}

function renderWishlist(){
  const saved=products.filter(p=>wishlist.includes(p.id));
  $("wishItems").innerHTML=saved.length?saved.map(p=>`
    <article class="card">
      <div class="picture">${p.icon}</div><h3>${p.name}</h3>
      <p class="price">₹${money(p.price)}</p>
      <button data-action="add" data-id="${p.id}">Add to Cart</button>
      <button class="danger" data-action="wish" data-id="${p.id}">Remove</button>
    </article>`).join(""):'<p class="empty">Your wishlist is empty.</p>';
}

function addToCart(id){
  const item=cart.find(p=>p.id===id);
  if(item)item.qty++;
  else cart.push({id,qty:1});
  renderCart();
  notify("Product added to cart!");
}

function handleProductClick(event){
  const btn=event.target.closest("[data-action]");
  if(!btn)return;
  const id=Number(btn.dataset.id);
  if(btn.dataset.action==="add")addToCart(id);
  if(btn.dataset.action==="wish"){
    wishlist=wishlist.includes(id)?wishlist.filter(x=>x!==id):[...wishlist,id];
    renderProducts();renderWishlist();
    notify("Wishlist updated!");
  }
  if(btn.dataset.action==="details"){
    const p=products.find(x=>x.id===id);
    alert(p.name+"\nPrice: ₹"+money(p.price)+"\n\n"+p.desc);
  }
}

$("products").addEventListener("click",handleProductClick);
$("wishItems").addEventListener("click",handleProductClick);

$("cartItems").addEventListener("click",event=>{
  const btn=event.target.closest("[data-action]");
  if(!btn)return;
  const id=Number(btn.dataset.id);
  const item=cart.find(p=>p.id===id);
  if(!item)return;
  if(btn.dataset.action==="plus")item.qty++;
  if(btn.dataset.action==="minus")item.qty--;
  if(btn.dataset.action==="remove")item.qty=0;
  cart=cart.filter(p=>p.qty>0);
  renderCart();
});

document.querySelectorAll("nav button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    category=btn.dataset.category;
    document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b===btn));
    renderProducts();
  });
});

$("search").addEventListener("input",renderProducts);
$("sort").addEventListener("change",renderProducts);

$("shopButton").addEventListener("click",()=>
  $("products").scrollIntoView({behavior:"smooth"}));

$("cartButton").addEventListener("click",()=>{
  $("cartPanel").classList.remove("hidden");
  $("wishPanel").classList.add("hidden");
  renderCart();
  $("cartPanel").scrollIntoView({behavior:"smooth"});
});

$("wishButton").addEventListener("click",()=>{
  $("wishPanel").classList.remove("hidden");
  $("cartPanel").classList.add("hidden");
  renderWishlist();
  $("wishPanel").scrollIntoView({behavior:"smooth"});
});

$("closeCart").addEventListener("click",()=>$("cartPanel").classList.add("hidden"));
$("closeWish").addEventListener("click",()=>$("wishPanel").classList.add("hidden"));

$("clearCart").addEventListener("click",()=>{
  cart=[];renderCart();notify("Cart cleared.");
});

$("checkout").addEventListener("click",()=>{
  if(!cart.length){notify("Your cart is empty!");return;}
  const total=cart.reduce((s,item)=>s+products.find(p=>p.id===item.id).price*item.qty,0);
  if(confirm("Confirm demo order for ₹"+money(total)+"?")){
    cart=[];renderCart();notify("Demo order completed successfully!");
  }
});

$("topButton").addEventListener("click",()=>
  window.scrollTo({top:0,behavior:"smooth"}));

renderProducts();
renderCart();
renderWishlist();
</script>
</body>
</html>
